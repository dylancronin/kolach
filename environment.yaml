name: kolach

channels:
  - conda-forge
  - bioconda

dependencies:
  - python=3.11
  - pip
  - git
  - diamond
  - mmseqs2
  - hmmer
  - dbcan=5.2.9
  # GraftM marker refinement (kolach annotate --add-specialisations). GraftM itself
  # is installed with pip below: its bioconda recipe pins HMMER 3.2.1, which
  # would downgrade the HMMER 3.4 used by KOfam and dbCAN.
  - pplacer
  - mafft
  - fasttree
  - orfm
  - mfqe
  - krona
  - taxtastic
  - biom-format
  - dendropy
  - extern
  - fastalite
  - bird_tool_utils_python
  - snakemake-minimal=9
  - pytorch
  - pandas
  - tqdm
  - pip:
      - git+https://github.com/eggnogdb/eggnog-mapper.git@b3757a6d226047527a729546e58ff530d76a5d7d
      - git+https://github.com/zhaoxi120/deepkoala.git
      - graftm==0.15.1
      - -e .
