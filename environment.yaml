name: kolach

channels:
  - conda-forge
  - bioconda

dependencies:
  - python=3.11
  - pip
  - git
  - diamond
  - mmseqs2
  - hmmer
  - dbcan=5.2.9
  # GraftM marker refinement (kolach annotate --add-specialisations). GraftM itself
  # is installed with pip below: its bioconda recipe pins HMMER 3.2.1, which
  # would downgrade the HMMER 3.4 used by KOfam and dbCAN. Its pure-Python
  # dependency `extern` also comes from pip: the conda-forge build is tagged
  # cp38, which `pip check` rejects on Python 3.11.
  # 1.1.alpha19 reproduces all recorded EMERGE/AnnoGuild placements; alpha23
  # moved 3 of 103 borderline SynComm placements (tests/annoguild_validation).
  - pplacer=1.1.alpha19
  - mafft
  - fasttree
  - orfm
  - mfqe
  - krona
  - taxtastic
  - biom-format
  - dendropy
  - fastalite
  - bird_tool_utils_python
  - snakemake-minimal=9
  - pytorch
  - pandas
  - tqdm
  - pip:
      - git+https://github.com/eggnogdb/eggnog-mapper.git@b3757a6d226047527a729546e58ff530d76a5d7d
      - git+https://github.com/zhaoxi120/deepkoala.git
      - graftm==0.15.1
      - -e .
