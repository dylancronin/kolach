name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install ruff
      - run: ruff check src tests

  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # snakemake enables the workflow dry-run tests in tests/test_workflows.py.
      - run: python -m pip install pandas numpy "snakemake>=9,<10"
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - name: CLI smoke test on bundled examples
        env:
          PYTHONPATH: src
        run: |
          python -m kolach.cli --help
          python -m kolach.cli integrate \
            --kofam-table examples/kofam_annotations.tsv \
            --deepkoala-table examples/deepkoala_annotations.tsv \
            --eggnog-table examples/eggnog_annotations.tsv \
            --output-file "$RUNNER_TEMP/kolach_annotations.tsv"
          test -s "$RUNNER_TEMP/kolach_annotations.tsv"
          test -s "$RUNNER_TEMP/kolach_evidence.tsv"
