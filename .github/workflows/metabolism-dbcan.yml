name: dbCAN metabolism
on:
  pull_request:
  push:
    branches: [metabolism/dbcan]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y diamond-aligner
      - run: python -m pip install dbcan==5.2.9 'snakemake>=9,<10'
      - run: python -m pip install --no-deps -e .
      - run: PYTHONPATH=src python -m unittest discover -s tests
      - run: PYTHONPATH=src python scripts/smoke_dbcan_search.py
