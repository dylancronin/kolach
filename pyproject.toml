[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kolach"
version = "0.2.1"
description = "Assign KEGG Orthology identifiers to proteins."
requires-python = ">=3.11"
dependencies = [
    "dbcan==5.2.9",
    "numpy",
    "pandas>=2.0.0",
    "tqdm>=4.60.0",
]

[project.optional-dependencies]
# Only DeepKOALA inference needs PyTorch; the upstream deepkoala package itself is
# installed from GitHub (see environment.yaml).
deepkoala = ["torch>=2.0.0"]
# GraftM marker refinement for `annotate --add-specialisations`. Its placement
# tools (pplacer, guppy, mafft, FastTree, HMMER) come from conda; see environment.yaml.
graftm = ["graftm==0.15.1"]

[project.scripts]
kolach = "kolach.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"kolach" = ["workflows/*.smk", "workflows/rules/*.smk", "workflows/profiles/*/config.yaml"]
"kolach.metabolism" = ["data/*.tsv", "data/*.json", "data/LICENSE.GPL-3.0", "data/dram_rules/*"]

[tool.ruff]
# Frozen copy of the previous integrate module used as a parity oracle.
extend-exclude = ["tests/reference"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
